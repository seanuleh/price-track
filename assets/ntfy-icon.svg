<?xml version="1.0" encoding="UTF-8"?>
<!-- price-track notification icon (ntfy X-Icon). Source of truth; rasterise with:
     rsvg-convert -w 512 -h 512 assets/ntfy-icon.svg -o price-track-icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0662C"/>
      <stop offset="1" stop-color="#A83F10"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Falling price line: a tracked price stepping down to the right. -->
  <path d="M 104 168 L 196 250 L 268 194 L 352 296"
        fill="none" stroke="#FFFFFF" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead closing the fall -->
  <path d="M 390 340 L 316 322 L 383 267 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>

  <!-- Baseline the price is measured against -->
  <path d="M 104 400 H 408" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="26" stroke-linecap="round"/>
</svg>
